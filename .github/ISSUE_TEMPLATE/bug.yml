name: Bug report
description: Report a reproducible harness, generated app, or verification bug.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: State what broke and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduce
      description: List exact commands, input files, branch, and run ID if available.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Paste the relevant error, report section, or test failure.
      render: shell
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Node, Yarn, OS, and whether this used `run`, `claude-run`, replay, or Strands.
    validations:
      required: true

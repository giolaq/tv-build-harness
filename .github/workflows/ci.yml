name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: packages/harness
            typecheck: true
          - package: packages/verification
            typecheck: false
          - package: packages/mini-harness
            typecheck: true
          - package: packages/web-ui
            typecheck: false
          - package: packages/shared-types
            typecheck: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Yarn
        uses: actions/cache@v4
        with:
          path: ~/.cache/yarn
          key: ${{ runner.os }}-node22-yarn-${{ matrix.package }}-${{ hashFiles(format('{0}/yarn.lock', matrix.package)) }}
          restore-keys: |
            ${{ runner.os }}-node22-yarn-${{ matrix.package }}-

      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: yarn install --frozen-lockfile

      - name: Typecheck
        if: ${{ matrix.typecheck }}
        working-directory: ${{ matrix.package }}
        run: yarn typecheck

      - name: Test
        if: ${{ matrix.package == 'packages/harness' || matrix.package == 'packages/verification' }}
        working-directory: ${{ matrix.package }}
        run: yarn test

      - name: Build
        if: ${{ matrix.package != 'packages/harness' }}
        working-directory: ${{ matrix.package }}
        run: yarn build

      - name: Check generated input docs
        if: ${{ matrix.package == 'packages/harness' }}
        run: packages/harness/node_modules/.bin/tsx scripts/gen-input-docs.ts --check

      - name: Check course doc paths
        if: ${{ matrix.package == 'packages/harness' }}
        run: packages/harness/node_modules/.bin/tsx scripts/check-course-paths.ts

      - name: Check phase resources
        if: ${{ matrix.package == 'packages/harness' }}
        run: packages/harness/node_modules/.bin/tsx scripts/check-resources.ts

      - name: Check example owner domains
        if: ${{ matrix.package == 'packages/harness' }}
        run: packages/harness/node_modules/.bin/tsx scripts/check-example-links.ts --domains-only

      - name: Check docs and examples for secrets
        if: ${{ matrix.package == 'packages/harness' }}
        run: packages/harness/node_modules/.bin/tsx scripts/scrub.ts --check docs examples

      - name: Replay full harness contract fixture
        if: ${{ matrix.package == 'packages/harness' }}
        working-directory: packages/harness
        run: npx tsx src/index.ts replay cooking-shows --json --speed 50

  fixture-replay:
    name: fixture replay
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Yarn
        uses: actions/cache@v4
        with:
          path: ~/.cache/yarn
          key: ${{ runner.os }}-node22-yarn-mini-${{ hashFiles('packages/mini-harness/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node22-yarn-mini-

      - name: Install mini-harness dependencies
        working-directory: packages/mini-harness
        run: yarn install --frozen-lockfile

      - name: Replay mini demo fixture
        working-directory: packages/mini-harness
        run: yarn dev --phases fixtures/phases.json --replay fixtures/demo-recording.json

      - name: Replay mini retry fixture
        working-directory: packages/mini-harness
        run: yarn dev --phases fixtures/phases.json --replay fixtures/retry-recording.json
